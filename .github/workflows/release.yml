name: Release

# Tag-triggered convenience release: the tracked source tree plus a pre-built
# web/dist/, so a user can run the coordinator without a Node toolchain
# (`pip install -r requirements.txt && python3 desktop_app.py`). Unlike the
# firmware devices there is no embedded trust/deployment key here —
# RECONCLAVE_EXECUTION_KEY / RECONCLAVE_EVIDENCE_KEY are supplied at runtime
# via the environment, never baked into a build — so this carries none of the
# "unprovisioned example build" caveats the ESP32/P4 firmware releases do.
#
# This is separate from, and does not replace, the maintainer's own
# Ed25519-signed formal source release described in
# https://github.com/Zetascrub/Reconclave/blob/main/docs/releasing.md — no
# private signing key lives in this workflow.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - run: pip install -r requirements.txt
      - run: python3 -m unittest discover -p 'test_*.py'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build

      - name: Stage release archive
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          STAGE="reconclave-command-${VERSION}"
          mkdir -p "dist/$STAGE"
          git archive HEAD | tar -x -C "dist/$STAGE"
          cp -r web/dist "dist/$STAGE/web/dist"
          mkdir -p dist-out
          ( cd dist && tar -czf "../dist-out/${STAGE}.tar.gz" "$STAGE" )
          ( cd dist-out && sha256sum -- * > SHA256SUMS )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/notes.md <<'EOF'
          Source tree at this tag with `web/dist/` pre-built, so you can run
          the coordinator without a Node toolchain:

          ```sh
          tar xzf reconclave-command-<version>.tar.gz
          cd reconclave-command-<version>
          python3 -m venv .venv-desktop-node
          .venv-desktop-node/bin/pip install -r requirements.txt
          .venv-desktop-node/bin/python desktop_app.py --mode both
          ```

          This is a convenience build, not the maintainer's signed formal
          source release — see
          [docs/releasing.md](https://github.com/Zetascrub/Reconclave/blob/main/docs/releasing.md)
          for that process and its Ed25519 verification steps.
          EOF
          gh release create "$GITHUB_REF_NAME" dist-out/* \
            --title "Reconclave Command $GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md
